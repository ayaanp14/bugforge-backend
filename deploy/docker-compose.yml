# The whole production stack on one Lightsail instance.
#
# Everything the API talks to now lives on the same box. That is the point of
# the move: the API used to sit in Singapore with MySQL on a shared host in
# the US (~500 ms a round trip) and Redis in us-east-1 (~300 ms). Both are now
# a loopback hop away, which is worth more than any query tuning in this repo.
#
# Only Caddy faces the internet (on the host network, see below; the API's
# port is bound to loopback for it). MySQL and Redis have no host port at all — they are
# reachable on the compose network and nowhere else, so the instance firewall
# is not the only thing standing between them and the internet.

name: codekairo

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The host's network, not the compose one, since the API got an IPv6
    # address (2026-10-03). The compose bridge is IPv4-only, so a published
    # port took IPv6 connections through docker-proxy, which re-originates them
    # from the bridge gateway: every IPv6 visitor would have reached Caddy --
    # and the rate limiters behind it -- as 172.18.0.1, one shared allowance.
    # On the host network Caddy accepts both families itself and sees each
    # peer as it is. (IPv6 on the compose network would preserve them too, but
    # recreating that network restarts MySQL.) Caddy binds 80 -- Let's
    # Encrypt's HTTP-01 challenge and the redirect to 443 -- and 443 directly,
    # and reaches the API on the loopback port the api service publishes.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The old Cloudflare Origin Certificate. Unused since the API went
      # DNS-only (2026-09-28, see the Caddyfile): the Let's Encrypt
      # certificate Caddy uses now lives in caddy-data.
      - ./certs:/etc/caddy/certs:ro
      # Caddy's certificates and ACME account, and its access log. Losing
      # this volume means re-issuing on the next start.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    # Built by .github/workflows/build-image.yml on every push to main and
    # pulled from here, so this box never compiles anything. Building in place
    # used to spike memory high enough to push InnoDB's buffer pool into swap
    # (measured: mysqld at 826 MB swapped, a COUNT at p95 69 ms).
    #
    # deploy/.env pins API_IMAGE to a `sha-<commit>` tag, so a reboot or a
    # watchdog restart brings back exactly the image that was verified, not
    # whatever CI has pushed since. The :latest default is only for a box that
    # has never been deployed to.
    #
    # No pull_policy: the tag is immutable and deploy.sh pulls it explicitly.
    # `always` would make every `docker compose up -d` -- including the one at
    # boot -- depend on the registry being reachable and authenticated.
    #
    # `build` stays as a fallback: `docker compose build api` still works if
    # the registry is unreachable or you need an image from uncommitted code.
    # Watch memory if you use it (see deploy.sh's header).
    image: ${API_IMAGE:-ghcr.io/ayaanp14/bugforge-backend:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Real environment lives in deploy/.env.production on the instance and is
    # never committed. See .env.example for every variable.
    env_file:
      - .env.production
    # For Caddy, which runs on the host network. Loopback only: from outside,
    # the API is still reachable through Caddy and nothing else.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Service names on the compose network, not localhost.
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # Node 22 has fetch built in, so this needs no curl in the image.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: codexa
      MYSQL_USER: codekairo
      # Both read from deploy/.env.production.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env.production}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/codekairo.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Capped hard: this box has 2 GB and MySQL wants most of it. The cache
    # degrades to a miss on eviction (lib/cache.ts), so a ceiling costs
    # correctness nothing.
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  redis-data:
